<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подбор решения ONDOC для клиники</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --ink:#132B29; --muted:#566966; --line:#C9D5D1; --soft:#E2E9E6;
  --accent:#17665A; --accent-ink:#FFFFFF; --accent-soft:#D6EAE4;
  --panel:#132B29; --panel-ink:#E8F1EE; --panel-muted:#9DB5AF; --panel-line:#2E4845;
  --mark:#D9A42B; --mark-soft:#F6E9C6; --err:#B3261E; --err-soft:#FBE9E7; --focus:#1F7AE0;
  --r-s:6px; --r-m:12px;
  --font:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1918; --surface:#152423; --ink:#E3EEEB; --muted:#9BB0AC; --line:#2C403D; --soft:#1C2E2C;
  --accent:#5BC2A7; --accent-ink:#0C1F1C; --accent-soft:#1E3D37;
  --panel:#091312; --panel-ink:#E3EEEB; --panel-muted:#8DA5A0; --panel-line:#253A37;
  --mark:#E8BC52; --mark-soft:#3A3220; --err:#F2948C; --err-soft:#3A1F1C; --focus:#7DB6FF; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1918; --surface:#152423; --ink:#E3EEEB; --muted:#9BB0AC; --line:#2C403D; --soft:#1C2E2C;
  --accent:#5BC2A7; --accent-ink:#0C1F1C; --accent-soft:#1E3D37;
  --panel:#091312; --panel-ink:#E3EEEB; --panel-muted:#8DA5A0; --panel-line:#253A37;
  --mark:#E8BC52; --mark-soft:#3A3220; --err:#F2948C; --err-soft:#3A1F1C; --focus:#7DB6FF; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1{font-size:clamp(1.6rem,4.2vw,2.25rem);line-height:1.15;font-weight:700;letter-spacing:-.015em;margin:.2em 0 .35em}
h2{font-size:1.2rem;line-height:1.3;font-weight:600;margin:1.4em 0 .5em}
h3{font-size:1rem;font-weight:600;margin:1.4em 0 .4em}
p{margin:.4em 0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.15rem;letter-spacing:.06em;color:var(--ink);text-decoration:none}
.top-r{display:contents}
.brand{margin-right:auto}
.switch{order:1}.langs{order:2}
@media (max-width:560px){ .top-in{row-gap:.35rem;padding:.45rem 1rem} .switch{order:3;flex-basis:100%;font-size:.85rem} }
.langs{display:flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.langs button{font:inherit;font-size:.85rem;font-weight:600;padding:.35rem .6rem;min-height:36px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.demo-bar{margin:0;padding:.4rem 1rem;text-align:center;font-size:.85rem;background:var(--mark-soft);color:var(--ink);border-top:1px solid var(--line)}

/* переключатели */
.switch,.tgl{display:flex;align-items:flex-start;gap:.6rem;cursor:pointer;font-size:.9rem}
.switch input,.tgl input{position:absolute;opacity:0;width:1px;height:1px}
.knob{flex:none;position:relative;width:40px;height:24px;border-radius:12px;background:var(--line);transition:background .15s}
.knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s}
input:checked+.knob{background:var(--accent)}
input:checked+.knob::after{transform:translateX(16px)}
input:focus-visible+.knob{outline:3px solid var(--focus);outline-offset:2px}

/* раскладка */
.wrap{max-width:1180px;margin:0 auto;padding:1rem 1rem 6rem;display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem}
.main{min-width:0;max-width:680px;outline:none}
.intro{color:var(--muted);font-size:.9rem;margin:-.6rem 0 1rem}
.lead{color:var(--muted);font-size:1.05rem;margin-bottom:1.2rem}
@media (min-width:960px){
  .wrap.with-panel{grid-template-columns:minmax(0,1fr) 380px;align-items:start}
  .wrap{padding-bottom:3rem}
}

/* прогресс */
.progress{grid-column:1/-1}
.progress ol{list-style:none;margin:0;padding:0;display:flex;gap:.25rem}
.progress li{flex:1;display:flex;align-items:center;gap:.45rem;padding:.45rem 0 .5rem;border-top:3px solid var(--line);color:var(--muted);font-size:.85rem}
.progress li.done{border-color:var(--accent);color:var(--ink)}
.progress li.cur{border-color:var(--ink);color:var(--ink);font-weight:600}
.progress .n{font-weight:700}
.pg-txt{display:none;font-size:.85rem;color:var(--muted);margin:0}
@media (max-width:560px){ .progress .nm{display:none} .progress li{justify-content:center} .pg-txt{display:block} }

/* поля */
.field{margin:1.3rem 0}
.lbl{display:block;font-weight:600;margin:0 0 .35rem}
.opt{font-weight:400;color:var(--muted);font-size:.9rem}
.hint{color:var(--muted);font-size:.9rem;margin:-.15rem 0 .55rem}
.small{color:var(--muted);font-size:.85rem}
.note{background:var(--accent-soft);border-left:3px solid var(--accent);padding:.55rem .75rem;border-radius:0 var(--r-s) var(--r-s) 0;font-size:.92rem}
.err{color:var(--err);font-size:.9rem;font-weight:500;margin:.35rem 0 0}
.err.sum{margin:1rem 0 0}
.has-err .txt,.has-err .dd{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.txt{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:.65rem .75rem;min-height:46px}
textarea.txt{min-height:84px;resize:vertical}
.txt::placeholder{color:var(--muted);opacity:.75}
.radios{display:grid;gap:.4rem}
.opt-r,.check{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer;padding:.35rem 0;min-height:44px}
.radios .opt-r{border:1px solid var(--line);border-radius:var(--r-s);padding:.6rem .75rem;background:var(--surface)}
.radios .opt-r:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt-r input,.check input{margin:.2rem 0 0;width:18px;height:18px;accent-color:var(--accent);flex:none}
.checks{display:grid;gap:.1rem}
.check span a{color:var(--accent)}

/* сегменты */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);overflow:hidden}
.seg .opt-r{padding:0;min-height:44px;border-left:1px solid var(--line);justify-content:center;align-items:stretch;position:relative}
.seg .opt-r:first-child{border-left:0}
.seg .opt-r input{position:absolute;opacity:0;width:1px;height:1px}
.seg .opt-r span{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;padding:.5rem .4rem;font-size:.92rem;line-height:1.25}
.seg .opt-r input:checked+span{background:var(--ink);color:var(--surface);font-weight:600}
.seg .opt-r input:focus-visible+span{outline:3px solid var(--focus);outline-offset:-3px}
.seg-sm .opt-r span{font-size:.85rem;padding:.3rem .5rem}
@media (max-width:560px){ .seg-3,.seg-4{grid-auto-flow:row} .seg-3 .opt-r,.seg-4 .opt-r{border-left:0;border-top:1px solid var(--line)} .seg-3 .opt-r:first-child,.seg-4 .opt-r:first-child{border-top:0} }

/* чипы */
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chips.more{margin-top:.6rem}
.chip{position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;padding:.5rem .85rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.95rem;line-height:1.25}
.chip input:checked+span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip input[type="checkbox"]:checked+span::before{content:"✓";font-weight:700}
.chip input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.link{font:inherit;background:none;border:0;padding:.4rem 0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px}
.postpone{margin-top:-.4rem}
.prio{list-style:none;padding:0;margin:.4rem 0 0;display:grid;gap:.5rem}
.prio li{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.4rem 0;border-bottom:1px solid var(--soft)}
.prio .seg{min-width:170px}

/* карточки продукта */
.pcards{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.pcard{position:relative;display:grid;gap:.15rem;padding:.8rem .9rem;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);cursor:pointer}
.pcard input{position:absolute;opacity:0}
.pcard:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.pcard:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.pc-n{font-weight:600}.pc-t{font-size:.88rem;color:var(--muted)}
.pcard-big{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:1.2rem 1.25rem;margin-top:.6rem}
.pcard-big h2{font-size:1.6rem;margin:.1rem 0 .1rem;letter-spacing:-.01em}
.badge{display:inline-block;margin:0;font-size:.82rem;font-weight:600;color:var(--accent)}
.tagline{font-size:1.05rem;margin:0 0 .6rem}
.why{padding:.55rem .75rem;background:var(--soft);border-radius:var(--r-s)}
.qa{display:grid;grid-template-columns:minmax(0,1fr);gap:.1rem;margin:.9rem 0 .4rem}
.qa dt{font-weight:600;font-size:.9rem;margin-top:.55rem}
.qa dd{margin:0;color:var(--ink)}
@media (min-width:720px){ .qa{grid-template-columns:200px minmax(0,1fr);column-gap:1.2rem} .qa dt{margin-top:.6rem} .qa dd{margin-top:.6rem} }
.launch{font-weight:500}
.hintbox{margin:.8rem 0;padding:.8rem 1rem;border:1px dashed var(--accent);border-radius:var(--r-m);background:var(--accent-soft)}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}
.switcher{margin:.5rem 0}
.switcher .seg{margin-top:.4rem}
.incl{margin:.3rem 0;padding-left:1.15rem}
.incl li{margin:.2rem 0}
.incl.later-l li,.incl.unc li{color:var(--muted)}
.toggles{display:grid;gap:.15rem}
.tgl{padding:.55rem 0;border-bottom:1px solid var(--soft);min-height:44px}
.tg-t{display:grid;gap:.1rem}
.tg-t small{color:var(--muted);font-size:.84rem}
.later{font-style:normal;font-size:.78rem;font-weight:600;color:var(--ink);background:var(--mark-soft);padding:.05rem .4rem;border-radius:4px;margin-left:.3rem}
.more-set{margin:1rem 0;border-top:1px solid var(--soft);padding-top:.5rem}
.more-set summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}

/* шаг 3 */
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--surface)}
.stepper button{font:inherit;font-size:1.3rem;width:48px;border:0;background:var(--soft);color:var(--ink);cursor:pointer}
.stepper .txt{border:0;border-radius:0;width:90px;text-align:center;font-weight:600;font-size:1.1rem;-moz-appearance:textfield}
.stepper .txt::-webkit-inner-spin-button{-webkit-appearance:none}
.field .seg+.chips,.field .seg+.txt{margin-top:.6rem}
.dd{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:.65rem 2.2rem .65rem .75rem;min-height:46px;cursor:pointer;position:relative}
.dd::after{content:"";position:absolute;right:.9rem;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.dd[aria-expanded="true"]::after{transform:translateY(-20%) rotate(-135deg)}
.dd-list{margin-top:.35rem;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);padding:.4rem .8rem .7rem}
.dd-list .check{border-bottom:1px solid var(--soft)}
.dd-list .excl{font-style:italic}
.sub{margin-top:.6rem}

/* шаг 4 */
.box{border:1px solid var(--line);border-radius:var(--r-m);padding:.6rem 1rem .9rem;margin:1.2rem 0;background:var(--surface)}
.box legend{font-weight:600;padding:0 .3rem}
.box.has-err{border-color:var(--err)}
.box .field{margin:.8rem 0}
.sub-h{font-size:1.05rem}
.consent .check{align-items:flex-start}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* проверка */
.rv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:.3rem 1.1rem .8rem;margin:1rem 0}
.rv-h{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.rv-h h2{margin:.7rem 0 .2rem}
.rv dl{margin:0}
.rv dl div{display:grid;grid-template-columns:minmax(0,1fr);padding:.35rem 0;border-top:1px solid var(--soft)}
.rv dt{color:var(--muted);font-size:.88rem}
.rv dd{margin:0}
@media (min-width:640px){ .rv dl div{grid-template-columns:230px minmax(0,1fr);gap:1rem} }
.alert{border:1px solid var(--err);background:var(--err-soft);border-radius:var(--r-m);padding:.5rem 1rem;margin:1rem 0}
.alert h2{margin:.4rem 0;font-size:1.05rem}

/* кнопки */
.nav{display:flex;gap:.6rem;margin-top:2rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:600;padding:.75rem 1.4rem;min-height:48px;border-radius:var(--r-s);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn-s{font:inherit;font-size:.9rem;font-weight:600;padding:.45rem .8rem;min-height:40px;border-radius:var(--r-s);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn-s.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.kept{margin-top:.8rem}

/* панель цены — прайс */
.panel{min-width:0}
.panel-body{background:var(--panel);color:var(--panel-ink);border-radius:var(--r-m);padding:1.15rem 1.2rem 1rem}
.panel-body .small,.panel-body .hint{color:var(--panel-muted)}
.state{margin:0 0 .7rem;font-weight:600;font-size:.95rem;color:var(--panel-muted)}
.assume{font-size:.85rem;color:var(--panel-ink);background:rgba(255,255,255,.07);border-radius:var(--r-s);padding:.4rem .55rem;margin:0 0 .7rem}
.r{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:.4rem;row-gap:.05rem;margin:.35rem 0}
.r-l{flex:1 1 9rem;font-size:.92rem}
.dots{flex:1 0 1rem;border-bottom:1px dotted currentColor;opacity:.4;transform:translateY(-.25em)}
.r-v{flex:0 1 auto;margin-left:auto;text-align:right;font-weight:600;max-width:100%}
.r.big .r-v{font-size:1.1rem}
.r.total{margin-top:.9rem;padding-top:.7rem;border-top:1px solid var(--panel-line)}
.r.total .r-v{font-size:1.25rem}
.calc-sub{font-weight:600;font-size:.9rem;margin:.95rem 0 .25rem}
.lst,.grid,.pp-list{margin:.2rem 0;padding-left:1.1rem;font-size:.9rem}
.lst li,.grid li,.pp-list li{margin:.15rem 0}
.est{margin:.9rem 0;padding:.6rem .75rem;border-left:4px solid var(--mark);background:rgba(217,164,43,.12);border-radius:0 var(--r-s) var(--r-s) 0}
.est .calc-sub{margin-top:0;color:var(--mark)}
.est ul{margin:.2rem 0 0;padding-left:1.1rem;font-size:.9rem}
.prepay{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;margin:.6rem 0 .3rem}
.prepay .calc-sub{grid-column:1/-1;margin:.3rem 0 .1rem}
.pp{position:relative;cursor:pointer}
.pp input{position:absolute;opacity:0}
.pp span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:40px;padding:.3rem .4rem;font-size:.84rem;border:1px solid var(--panel-line);border-radius:var(--r-s)}
.pp input:checked+span{background:var(--panel-ink);color:var(--panel);font-weight:600;border-color:var(--panel-ink)}
.pp input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.pp-res{font-size:.88rem;margin:.3rem 0}
.addon{margin-top:.9rem;padding-top:.5rem;border-top:1px solid var(--panel-line)}
.launch-t{margin-top:.9rem;font-weight:500}
.trust{font-size:.8rem;color:var(--panel-muted);border-top:1px solid var(--panel-line);padding-top:.7rem;margin-top:.9rem}
.sheet-bar{display:none}
@media (min-width:960px){ .panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 96px);overflow:auto;border-radius:var(--r-m)} }
@media (max-width:959px){
  .panel{position:fixed;left:0;right:0;bottom:0;z-index:30}
  .sheet-bar{display:flex;width:100%;justify-content:space-between;align-items:center;gap:.6rem;font:inherit;text-align:left;border:0;cursor:pointer;
    background:var(--panel);color:var(--panel-ink);padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--panel-line);box-shadow:0 -6px 18px rgba(0,0,0,.18)}
  .sb-sum{display:grid;font-weight:600;font-size:.92rem;line-height:1.35}
  .sb-t{font-size:.85rem;color:var(--panel-muted);text-decoration:underline;flex:none}
  .panel-body{display:none;border-radius:var(--r-m) var(--r-m) 0 0;max-height:78vh;overflow:auto;padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px))}
  .panel.open .panel-body{display:block}
  .panel.open .sheet-bar{border-radius:0}
  .panel.open{display:flex;flex-direction:column-reverse}
}

/* результат */
.res-h .num{font-weight:600;font-size:1.05rem}
.res-s{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:.4rem 1.2rem 1rem;margin:1rem 0}
.res-s h2{margin:.8rem 0 .4rem}
.res-p{font-weight:600}
.calc-full{background:var(--panel);color:var(--panel-ink);border:0;padding-top:1rem}
.calc-full .small{color:var(--panel-muted)}
.next .btn{margin:.5rem .4rem .3rem 0}
.demo-note{background:var(--mark-soft);padding:.55rem .8rem;border-radius:var(--r-s)}
.demo-out{border-style:dashed}
.demo-d{border-top:1px solid var(--soft);padding:.4rem 0}
.demo-d summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.demo-tools{display:flex;justify-content:flex-end}
.demo-d pre{white-space:pre-wrap;word-break:break-word;font:400 .82rem/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--soft);padding:.8rem;border-radius:var(--r-s);max-height:520px;overflow:auto}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>

    }
    U.submitting = true; U.sendError = null; render();
    var payload = { request_key: U.requestKey, lang: U.lang, pl: E.pl, utm: U.utm, referrer: document.referrer || '', started_at: U.startedAt,
      answers: E.cleanAnswers(S), recommended: S.recommended, captcha_token: U.captchaToken || null, hp_website: hp ? hp.value : '' };

  function send(payload, attempt) {
    var ctrl = new AbortController(), timer = setTimeout(function () { ctrl.abort(); }, 15000);
    fetch(RT.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Idempotency-Key': payload.request_key }, body: JSON.stringify(payload), signal: ctrl.signal })
      .then(function (res) {
        clearTimeout(timer);
        return res.json().catch(function () { return {}; }).then(function (j) { return { status: res.status, body: j }; });
      })
      .then(function (r) {
        U.submitting = false;
        if ((r.status === 200 || r.status === 201) && r.body.request_id) {
          var req = E.buildRequest(S, { request_key: payload.request_key, request_id: r.body.request_id, lang: U.lang });
          U.result = { req: req, pdfUrl: r.body.pdf_url || null, notifyQueued: r.body.notify_status === 'queued' };
          goal('submit_success'); go(6); return;
        }
        if (r.status === 429) U.sendError = { key: 'errors.rate_limit' };
        else if (r.status === 422) { U.sendError = { key: 'errors.validation_server' }; }
        else if (r.status === 403) { U.sendError = { key: 'errors.captcha_failed' }; U.captchaToken = null; if (window.smartCaptcha && U.captchaId != null) window.smartCaptcha.reset(U.captchaId); }
        else U.sendError = { key: 'errors.server_text', retry: true };
        render();
      })
      .catch(function () {
        clearTimeout(timer);
        if (attempt < 2 && navigator.onLine !== false) { U.sendError = { key: 'errors.timeout_text' }; render(); setTimeout(function () { send(payload, attempt + 1); }, 2000); return; }
        U.submitting = false;
        U.sendError = { key: navigator.onLine === false ? 'errors.offline' : 'errors.network_text', retry: true };
        render();
      });
  }

    if (act === 'postpone') { U.showPostpone = !U.showPostpone; return render(); }
    if (act === 'switch') { U.showSwitch = !U.showSwitch; return render(); }
    if (act === 'unswitch') { S.product_override = null; applyRules(); U.showSwitch = false; return render(); }
    if (act === 'hint-show') { S.product_choice = v; applyRules(); return render(); }
    if (act === 'hint-keep') { U.dismissed[v] = true; return render(); }
    if (act === 'mis') { U.misOpen = !U.misOpen; return render('i-mis-0'); }
